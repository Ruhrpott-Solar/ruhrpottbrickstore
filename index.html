<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ruhrpott Brick Store | Klemmbausteine & Modelle</title>

    <meta name="description"
          content="Gebrauchte und neue Klemmbausteine, Modelle und Ersatzteile. Besuche unseren eBay-Shop oder BrickOwl-Shop.">

    <meta name="theme-color" content="#f58220">

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;

            background:
                radial-gradient(
                    circle at top,
                    #3a3a3a 0%,
                    #181818 45%,
                    #080808 100%
                );

            color: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        /* =========================================
           HERO
        ========================================= */

        .hero {
            width: 100%;
            max-width: 1350px;

            margin: 25px auto 0;

            padding: 0 15px;
        }


        .hero-inner {
            position: relative;

            width: 100%;

            overflow: hidden;

            border-radius: 24px;

            border: 3px solid #ff8a00;

            box-shadow:
                0 0 15px rgba(255,138,0,0.85),
                0 0 40px rgba(255,90,0,0.45),
                0 25px 70px rgba(0,0,0,0.75);
        }


        .hero-image {
            display: block;

            width: 100%;
            height: auto;

            vertical-align: middle;
        }


        /* =========================================
           KLICKBARE BUTTON-BEREICHE
        ========================================= */

        .hero-link {
            position: absolute;

            display: block;

            border-radius: 18px;

            text-decoration: none;

            z-index: 10;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }


        /*
        Die Positionen orientieren sich exakt
        an den Buttons im neuen Bild.
        */


        /* eBay */

        .hero-ebay {

            left: 4.5%;
            top: 68.0%;

            width: 44.5%;
            height: 9.8%;
        }


        /* BrickOwl */

        .hero-brickowl {

            left: 50.8%;
            top: 68.0%;

            width: 44.5%;
            height: 9.8%;
        }


        /* WhatsApp */

        .hero-whatsapp {

            left: 4.5%;
            top: 79.0%;

            width: 44.5%;
            height: 9.8%;
        }


        /* E-Mail */

        .hero-email {

            left: 50.8%;
            top: 79.0%;

            width: 44.5%;
            height: 9.8%;
        }


        /* =========================================
           HOVER-EFFEKT
        ========================================= */

        .hero-link:hover {

            transform:
                translateY(-3px)
                scale(1.015);

            background:
                rgba(255,255,255,0.08);

            box-shadow:
                inset 0 0 12px rgba(255,255,255,0.35),
                0 0 18px rgba(255,255,255,0.5);
        }


        .hero-link:active {

            transform:
                translateY(0)
                scale(0.99);
        }


        /* =========================================
           HILFSTEXT FÜR BARRIEREFREIHEIT
        ========================================= */

        .hero-link span {

            position: absolute;

            width: 1px;
            height: 1px;

            padding: 0;
            margin: -1px;

            overflow: hidden;

            clip: rect(0,0,0,0);

            white-space: nowrap;

            border: 0;
        }


        /* =========================================
           MAIN
        ========================================= */

        main {

            width: 100%;

            max-width: 1200px;

            margin: 0 auto;

            padding: 25px 20px 30px;
        }


        /* =========================================
           INFO-BEREICH
        ========================================= */

        .info {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 18px;

            margin-top: 5px;
        }


        .info-box {

            padding: 18px;

            text-align: center;

            border-radius: 15px;

            border: 1px solid
                rgba(255,138,0,0.5);

            background:
                linear-gradient(
                    135deg,
                    rgba(35,35,35,0.95),
                    rgba(15,15,15,0.95)
                );

            box-shadow:
                0 0 15px
                rgba(255,138,0,0.12);

            color: #ffffff;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }


        .info-box:hover {

            transform:
                translateY(-4px);

            box-shadow:
                0 0 20px
                rgba(255,138,0,0.35);
        }


        .info-icon {

            display: block;

            margin-bottom: 8px;

            font-size: 30px;
        }


        .info-title {

            font-size: 17px;

            font-weight: 800;

            color: #ff8a00;
        }


        .info-text {

            margin-top: 5px;

            font-size: 14px;

            color: #cccccc;
        }


        /* =========================================
           FOOTER
        ========================================= */

        footer {

            width: 100%;

            margin-top: 15px;

            padding: 30px 20px 40px;

            text-align: center;

            border-top:
                2px solid
                rgba(255,138,0,0.7);

            background:
                linear-gradient(
                    180deg,
                    rgba(20,20,20,0.95),
                    #070707
                );

            box-shadow:
                0 -10px 35px
                rgba(0,0,0,0.45);
        }


        footer p {

            margin:
                0 0 12px;

            color: #aaaaaa;

            font-size: 15px;
        }


        footer nav {

            font-size: 15px;
        }


        footer a {

            color: #ff8a00;

            text-decoration: none;

            font-weight: 700;

            transition:
                color 0.2s ease,
                text-shadow 0.2s ease;
        }


        footer a:hover {

            color: #ffffff;

            text-shadow:
                0 0 8px #ff8a00,
                0 0 18px #ff8a00;
        }


        footer span {

            margin:
                0 8px;

            color: #666666;
        }


        /* =========================================
           TABLET
        ========================================= */

        @media (max-width: 800px) {

            .hero {

                margin-top: 12px;

                padding:
                    0 8px;
            }


            .hero-inner {

                border-radius: 17px;

                border-width: 2px;
            }


            .info {

                grid-template-columns:
                    1fr;
            }
        }


        /* =========================================
           HANDY
        ========================================= */

        @media (max-width: 500px) {

            .hero {

                padding: 0 5px;
            }


            .hero-inner {

                border-radius: 13px;
            }


            /*
            Auf kleinen Displays werden die
            klickbaren Bereiche etwas großzügiger.
            */

            .hero-ebay,
            .hero-brickowl {

                top: 67.5%;

                height: 10.5%;
            }


            .hero-whatsapp,
            .hero-email {

                top: 78.5%;

                height: 10.5%;
            }


            main {

                padding:
                    15px 10px 25px;
            }


            footer {

                padding:
                    25px 10px 30px;
            }


            footer nav {

                font-size: 13px;
            }
        }

    </style>

</head>


<body>


    <!-- =========================================
         HERO
    ========================================= -->

    <header class="hero">

        <div class="hero-inner">

            <img
                src="assets/images/hero.webp"
                alt="Ruhrpott Brick Store – Klemmbausteine, Modelle und mehr"
                class="hero-image"
            >


            <!-- eBay -->

            <a
                class="hero-link hero-ebay"
                href="https://www.ebay.de/usr/ruhrpott-brick-store"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Zum eBay-Shop"
            >
                <span>Zum eBay-Shop</span>
            </a>


            <!-- BrickOwl -->

            <a
                class="hero-link hero-brickowl"
                href="https://ruhrpottbrickstore.brickowl.com/"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Zum BrickOwl-Shop"
            >
                <span>Zum BrickOwl-Shop</span>
            </a>


            <!-- WhatsApp -->

            <a
                class="hero-link hero-whatsapp"
                href="https://wa.me/491633780217"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Kontakt über WhatsApp"
            >
                <span>WhatsApp</span>
            </a>


            <!-- E-Mail -->

            <a
                class="hero-link hero-email"
                href="mailto:info@ruhrpottbrickstore.de"
                aria-label="E-Mail schreiben"
            >
                <span>E-Mail</span>
            </a>

        </div>

    </header>


    <!-- =========================================
         INFO
    ========================================= -->

    <main>

        <section class="info">


            <div class="info-box">

                <span class="info-icon">🚚</span>

                <div class="info-title">
                    Schneller Versand
                </div>

                <div class="info-text">
                    Sicher verpackt und schnell auf dem Weg.
                </div>

            </div>


            <div class="info-box">

                <span class="info-icon">🛡️</span>

                <div class="info-title">
                    Sicher bezahlen
                </div>

                <div class="info-text">
                    Einfach und bequem über unsere Shops.
                </div>

            </div>


            <div class="info-box">

                <span class="info-icon">🧱</span>

                <div class="info-title">
                    Für Baufans
                </div>

                <div class="info-text">
                    Klemmbausteine, Modelle, Ersatzteile und mehr.
                </div>

            </div>


        </section>

    </main>


    <!-- =========================================
         FOOTER
    ========================================= -->

    <footer>

        <p>
            © Ruhrpott Brick Store
        </p>


        <nav>

            <a href="impressum.html">
                Impressum
            </a>

            <span>|</span>

            <a href="datenschutz.html">
                Datenschutz
            </a>

        </nav>

    </footer>


</body>

</html>
