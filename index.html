<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Ruhrpott Brick Store | Klemmbausteine & Modelle
    </title>

    <meta name="description"
          content="Gebrauchte und neue Klemmbausteine, Modelle und Ersatzteile. Besuche unseren eBay-Shop oder BrickOwl-Shop.">

    <meta name="theme-color"
          content="#f58220">


    <style>

        /* =========================================
           GRUNDLAYOUT
        ========================================= */

        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            margin: 0;
            padding: 0;

            background:
                radial-gradient(
                    circle at top,
                    #3a3a3a 0%,
                    #191919 45%,
                    #080808 100%
                );

            color: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }



        /* =========================================
           HERO
        ========================================= */

        .hero {

            width: 100%;

            max-width: 1100px;

            margin: 20px auto 0;

            padding: 0 12px;
        }


        .hero-inner {

            position: relative;

            width: 100%;

            overflow: hidden;

            border-radius: 20px;

            border: 2px solid #ff8a00;

            background: #111111;

            box-shadow:

                0 0 12px
                rgba(255,138,0,0.8),

                0 0 30px
                rgba(255,90,0,0.45),

                0 18px 50px
                rgba(0,0,0,0.7);
        }


        .hero-image {

            display: block;

            width: 100%;

            height: auto;

            vertical-align: middle;
        }



        /* =========================================
           KLICKBARE BEREICHE
        ========================================= */

        .hero-link {

            position: absolute;

            display: block;

            z-index: 10;

            border-radius: 14px;

            text-decoration: none;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }


        /*
        Position der vier Buttons
        passend zum neuen Bild
        */


        /* eBay */

        .hero-ebay {

            left: 4.5%;

            top: 68%;

            width: 45%;

            height: 9.5%;
        }


        /* BrickOwl */

        .hero-brickowl {

            left: 50.8%;

            top: 68%;

            width: 44.5%;

            height: 9.5%;
        }


        /* WhatsApp */

        .hero-whatsapp {

            left: 4.5%;

            top: 79%;

            width: 45%;

            height: 9.5%;
        }


        /* E-Mail */

        .hero-email {

            left: 50.8%;

            top: 79%;

            width: 44.5%;

            height: 9.5%;
        }


        .hero-link:hover {

            transform:
                scale(1.015);

            background:
                rgba(255,255,255,0.08);

            box-shadow:

                inset 0 0 10px
                rgba(255,255,255,0.3),

                0 0 15px
                rgba(255,255,255,0.4);
        }


        .hero-link:active {

            transform:
                scale(0.99);
        }


        .hero-link span {

            position: absolute;

            width: 1px;
            height: 1px;

            padding: 0;
            margin: -1px;

            overflow: hidden;

            clip: rect(0,0,0,0);

            white-space: nowrap;

            border: 0;
        }



        /* =========================================
           HAUPTBEREICH
        ========================================= */

        main {

            width: 100%;

            max-width: 1000px;

            margin: 0 auto;

            padding:
                20px 15px 25px;
        }



        /* =========================================
           INFOBOXEN
        ========================================= */

        .info {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 16px;

            margin-top: 5px;
        }


        .info-box {

            padding: 16px;

            text-align: center;

            border-radius: 14px;

            border:
                1px solid
                rgba(255,138,0,0.5);

            background:

                linear-gradient(
                    135deg,
                    rgba(35,35,35,0.95),
                    rgba(12,12,12,0.95)
                );

            box-shadow:

                0 0 12px
                rgba(255,138,0,0.12);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .info-box:hover {

            transform:
                translateY(-3px);

            box-shadow:

                0 0 18px
                rgba(255,138,0,0.35);
        }


        .info-icon {

            display: block;

            margin-bottom: 6px;

            font-size: 26px;
        }


        .info-title {

            font-size: 16px;

            font-weight: 800;

            color: #ff8a00;
        }


        .info-text {

            margin-top: 5px;

            font-size: 13px;

            color: #cccccc;
        }



        /* =========================================
           FOOTER
        ========================================= */

        footer {

            width: 100%;

            margin-top: 10px;

            padding:
                25px 15px 30px;

            text-align: center;

            border-top:
                2px solid
                rgba(255,138,0,0.7);

            background:

                linear-gradient(
                    180deg,
                    rgba(20,20,20,0.95),
                    #070707
                );

            box-shadow:

                0 -8px 25px
                rgba(0,0,0,0.4);
        }


        footer p {

            margin:
                0 0 10px;

            color: #aaaaaa;

            font-size: 14px;
        }


        footer nav {

            font-size: 14px;
        }


        footer a {

            color: #ff8a00;

            text-decoration: none;

            font-weight: 700;

            transition:
                color 0.2s ease,
                text-shadow 0.2s ease;
        }


        footer a:hover {

            color: #ffffff;

            text-shadow:

                0 0 7px
                #ff8a00,

                0 0 15px
                #ff8a00;
        }


        footer span {

            margin:
                0 7px;

            color: #666666;
        }



        /* =========================================
           TABLET
        ========================================= */

        @media (max-width: 800px) {

            .hero {

                margin-top: 12px;

                padding:
                    0 8px;
            }


            .hero-inner {

                border-radius: 16px;
            }


            .info {

                grid-template-columns:
                    1fr;
            }
        }



        /* =========================================
           HANDY
        ========================================= */

        @media (max-width: 500px) {

            .hero {

                padding:
                    0 5px;
            }


            .hero-inner {

                border-radius: 12px;
            }


            .hero-ebay,
            .hero-brickowl {

                top: 67.5%;

                height: 10%;
            }


            .hero-whatsapp,
            .hero-email {

                top: 78.5%;

                height: 10%;
            }


            main {

                padding:
                    15px 10px 20px;
            }


            .info-box {

                padding: 14px;
            }


            footer {

                padding:
                    22px 10px 28px;
            }


            footer nav {

                font-size: 13px;
            }
        }



    </style>

</head>


<body>


    <!-- =========================================
         HERO
    ========================================= -->

    <header class="hero">

        <div class="hero-inner">


            <img
                src="assets/images/hero.webp"
                alt="Ruhrpott Brick Store – Klemmbausteine, Modelle und mehr"
                class="hero-image"
            >



            <!-- =================================
                 EBAY
            ================================= -->

            <a
                class="hero-link hero-ebay"

                href="https://www.ebay.de/usr/ruhrpott-brick-store"

                target="_blank"

                rel="noopener noreferrer"

                aria-label="Zum eBay-Shop"
            >

                <span>
                    Zum eBay-Shop
                </span>

            </a>



            <!-- =================================
                 BRICKOWL
            ================================= -->

            <a
                class="hero-link hero-brickowl"

                href="https://ruhrpottbrickstore.brickowl.com/"

                target="_blank"

                rel="noopener noreferrer"

                aria-label="Zum BrickOwl-Shop"
            >

                <span>
                    Zum BrickOwl-Shop
                </span>

            </a>



            <!-- =================================
                 WHATSAPP
            ================================= -->

            <a
                class="hero-link hero-whatsapp"

                href="https://wa.me/491633780217"

                target="_blank"

                rel="noopener noreferrer"

                aria-label="Kontakt über WhatsApp"
            >

                <span>
                    WhatsApp
                </span>

            </a>



            <!-- =================================
                 E-MAIL
            ================================= -->

            <a
                class="hero-link hero-email"

                href="mailto:info@ruhrpottbrickstore.de"

                aria-label="E-Mail schreiben"
            >

                <span>
                    E-Mail
                </span>

            </a>


        </div>

    </header>



    <!-- =========================================
         INFO
    ========================================= -->

    <main>


        <section class="info">


            <div class="info-box">

                <span class="info-icon">
                    🚚
                </span>

                <div class="info-title">
                    Schneller Versand
                </div>

                <div class="info-text">
                    Sicher verpackt und schnell auf dem Weg.
                </div>

            </div>



            <div class="info-box">

                <span class="info-icon">
                    🛡️
                </span>

                <div class="info-title">
                    Sicher bezahlen
                </div>

                <div class="info-text">
                    Einfach und bequem über unsere Shops.
                </div>

            </div>



            <div class="info-box">

                <span class="info-icon">
                    🧱
                </span>

                <div class="info-title">
                    Für Baufans
                </div>

                <div class="info-text">
                    Klemmbausteine, Modelle, Ersatzteile und mehr.
                </div>

            </div>


        </section>


    </main>



    <!-- =========================================
         FOOTER
    ========================================= -->

    <footer>


        <p>
            © Ruhrpott Brick Store
        </p>


        <nav>

            <a href="impressum.html">
                Impressum
            </a>

            <span>|</span>

            <a href="datenschutz.html">
                Datenschutz
            </a>

        </nav>


    </footer>


</body>

</html>
